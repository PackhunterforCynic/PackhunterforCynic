<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 44" width="208" height="44">
  <defs>
    <linearGradient id="bg-05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E" />
      <stop offset="60%" stop-color="#060606" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="glow-05" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .font-mono { font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
    @keyframes pulseLed {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .led { transform-origin: 18px 22px; animation: pulseLed 2s infinite ease-in-out; }
    .btn-frame:hover { stroke: #00F2FE; }
  </style>
  <rect class="btn-frame" x="2" y="2" width="204" height="40" rx="8" fill="url(#bg-05)" stroke="#22272E" stroke-width="1.2" />
  <circle cx="18" cy="22" r="4.5" fill="#00F2FE" class="led" filter="url(#glow-05)" />
  <text x="32" y="26" class="font-mono" font-size="11" font-weight="700" fill="#F0F6FC" letter-spacing="0.3">
    05 // LIVE TELEMETRY
  </text>
  <path d="M 194 18 L 198 22 L 194 26" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>