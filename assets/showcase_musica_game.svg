<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 290" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E1C" />
      <stop offset="60%" stop-color="#051416" />
      <stop offset="100%" stop-color="#02090B" />
    </linearGradient>
    <linearGradient id="glow-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20D9D2" />
      <stop offset="100%" stop-color="#39F59A" />
    </linearGradient>
    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes wavePulse {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1.1); }
    }
    @keyframes peerPing {
      0% { r: 6; opacity: 1; }
      100% { r: 24; opacity: 0; }
    }
    .wave-bar { transform-origin: bottom; animation: wavePulse 1.2s ease-in-out infinite alternate; }
    .ping-ring { animation: peerPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
  </style>

  <!-- Left Card: Musica Platform -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="536" height="284" rx="14" fill="url(#card-bg)" stroke="#174D43" stroke-width="1.5" />
    <path d="M 2 16 Q 2 2 16 2 L 522 2 Q 536 2 536 16 L 536 44 L 2 44 Z" fill="#09221F" />
    <line x1="2" y1="44" x2="538" y2="44" stroke="#174D43" stroke-width="1.2" />

    <!-- Status Dots -->
    <circle cx="20" cy="23" r="4.5" fill="#39F59A" />
    <circle cx="34" cy="23" r="4.5" fill="#20D9D2" />
    <text x="48" y="27" class="font-mono" font-size="11" font-weight="700" fill="#9BAEAA">ENGINE 01 // REAL-TIME MESH</text>
    <rect x="420" y="13" width="102" height="20" rx="4" fill="#061F17" stroke="#39F59A" stroke-width="1" />
    <text x="471" y="27" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="800" fill="#39F59A">● LIVE DEMO</text>

    <!-- Project Title -->
    <text x="24" y="78" class="font-sans" font-size="21" font-weight="800" fill="#F4F7F6">📡 Musica Audio Platform</text>
    <text x="24" y="98" class="font-sans" font-size="12" fill="#9BAEAA">Zero-DB WebSockets &amp; WebRTC real-time audio core</text>

    <!-- Vector WebRTC Wave & P2P Mesh Diagram -->
    <rect x="24" y="112" width="488" height="92" rx="8" fill="#040F11" stroke="#143D36" stroke-width="1" />
    
    <!-- P2P Peer 1 -->
    <circle cx="70" cy="158" r="14" fill="#082A24" stroke="#39F59A" stroke-width="2" />
    <circle cx="70" cy="158" r="6" fill="#39F59A" />
    <circle cx="70" cy="158" class="ping-ring" fill="none" stroke="#39F59A" stroke-width="1.5" />
    <text x="70" y="186" text-anchor="middle" class="font-mono" font-size="9" fill="#9BAEAA">PEER_A</text>

    <!-- Animated Data Waves -->
    <g transform="translate(100, 140)">
      <rect class="wave-bar" x="0" y="0" width="4" height="34" rx="2" fill="#20D9D2" style="animation-delay: 0.1s;" />
      <rect class="wave-bar" x="10" y="0" width="4" height="24" rx="2" fill="#39F59A" style="animation-delay: 0.3s;" />
      <rect class="wave-bar" x="20" y="0" width="4" height="36" rx="2" fill="#20D9D2" style="animation-delay: 0.05s;" />
      <rect class="wave-bar" x="30" y="0" width="4" height="18" rx="2" fill="#39F59A" style="animation-delay: 0.4s;" />
      <rect class="wave-bar" x="40" y="0" width="4" height="30" rx="2" fill="#20D9D2" style="animation-delay: 0.2s;" />
      <rect class="wave-bar" x="50" y="0" width="4" height="22" rx="2" fill="#39F59A" style="animation-delay: 0.5s;" />
      <rect class="wave-bar" x="60" y="0" width="4" height="34" rx="2" fill="#20D9D2" style="animation-delay: 0.15s;" />
      <rect class="wave-bar" x="70" y="0" width="4" height="26" rx="2" fill="#39F59A" style="animation-delay: 0.35s;" />
    </g>

    <!-- Signaling WebSocket Cloud -->
    <rect x="200" y="138" width="130" height="40" rx="6" fill="#08221D" stroke="#20D9D2" stroke-width="1.2" />
    <text x="265" y="155" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#20D9D2">WS SIGNALING</text>
    <text x="265" y="170" text-anchor="middle" class="font-mono" font-size="8.5" fill="#39F59A">&lt;18ms LATENCY</text>

    <!-- Animated Data Waves Right -->
    <g transform="translate(350, 140)">
      <rect class="wave-bar" x="0" y="0" width="4" height="28" rx="2" fill="#20D9D2" style="animation-delay: 0.25s;" />
      <rect class="wave-bar" x="10" y="0" width="4" height="34" rx="2" fill="#39F59A" style="animation-delay: 0.1s;" />
      <rect class="wave-bar" x="20" y="0" width="4" height="20" rx="2" fill="#20D9D2" style="animation-delay: 0.4s;" />
      <rect class="wave-bar" x="30" y="0" width="4" height="36" rx="2" fill="#39F59A" style="animation-delay: 0.15s;" />
      <rect class="wave-bar" x="40" y="0" width="4" height="24" rx="2" fill="#20D9D2" style="animation-delay: 0.3s;" />
    </g>

    <!-- P2P Peer 2 -->
    <circle cx="465" cy="158" r="14" fill="#082A24" stroke="#20D9D2" stroke-width="2" />
    <circle cx="465" cy="158" r="6" fill="#20D9D2" />
    <circle cx="465" cy="158" class="ping-ring" fill="none" stroke="#20D9D2" stroke-width="1.5" style="animation-delay: 1s;" />
    <text x="465" y="186" text-anchor="middle" class="font-mono" font-size="9" fill="#9BAEAA">PEER_B</text>

    <!-- Tech Badges -->
    <g transform="translate(24, 218)">
      <rect x="0" y="0" width="86" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="43" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#39F59A">TypeScript</text>

      <rect x="94" y="0" width="76" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="132" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#20D9D2">Node.js</text>

      <rect x="178" y="0" width="80" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="218" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#39F59A">WebRTC</text>

      <rect x="266" y="0" width="76" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="304" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#20D9D2">Socket.IO</text>

      <rect x="350" y="0" width="68" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="384" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#39F59A">Docker</text>

      <rect x="426" y="0" width="86" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="469" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#20D9D2">Zero-DB</text>
    </g>

    <!-- Bottom Action Prompt -->
    <text x="24" y="266" class="font-mono" font-size="10.5" font-weight="700" fill="#39F59A">
      [🎧 musica-apvs.vercel.app ↗]  •  [github.com/PackhunterforCynic/musica ↗]
    </text>
  </g>

  <!-- Right Card: Ben 10 Alien Battle Arena -->
  <g transform="translate(562, 0)">
    <rect x="2" y="2" width="534" height="284" rx="14" fill="url(#card-bg)" stroke="#174D43" stroke-width="1.5" />
    <path d="M 2 16 Q 2 2 16 2 L 520 2 Q 534 2 534 16 L 534 44 L 2 44 Z" fill="#09221F" />
    <line x1="2" y1="44" x2="536" y2="44" stroke="#174D43" stroke-width="1.2" />

    <!-- Status Dots -->
    <circle cx="20" cy="23" r="4.5" fill="#39F59A" />
    <circle cx="34" cy="23" r="4.5" fill="#20D9D2" />
    <text x="48" y="27" class="font-mono" font-size="11" font-weight="700" fill="#9BAEAA">ENGINE 02 // DETERMINISTIC P2P</text>
    <rect x="418" y="13" width="102" height="20" rx="4" fill="#061F17" stroke="#39F59A" stroke-width="1" />
    <text x="469" y="27" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="800" fill="#39F59A">● LIVE GAME</text>

    <!-- Project Title -->
    <text x="24" y="78" class="font-sans" font-size="21" font-weight="800" fill="#F4F7F6">🎮 Ben 10: Alien Battle Arena</text>
    <text x="24" y="98" class="font-sans" font-size="12" fill="#9BAEAA">2D fighting engine in Phaser 4 with PeerJS direct multiplayer</text>

    <!-- Vector Arcade HUD & Game Loop Diagram -->
    <rect x="24" y="112" width="486" height="92" rx="8" fill="#040F11" stroke="#143D36" stroke-width="1" />
    
    <!-- Health Bar 1 -->
    <text x="40" y="134" class="font-mono" font-size="9.5" font-weight="700" fill="#39F59A">PLAYER 1 // FOURARMS</text>
    <rect x="40" y="140" width="180" height="10" rx="3" fill="#0B1E1C" stroke="#174D43" stroke-width="1" />
    <rect x="41" y="141" width="150" height="8" rx="2" fill="url(#glow-emerald)" />

    <!-- Health Bar 2 -->
    <text x="266" y="134" class="font-mono" font-size="9.5" font-weight="700" fill="#20D9D2">PLAYER 2 // HEATBLAST</text>
    <rect x="266" y="140" width="180" height="10" rx="3" fill="#0B1E1C" stroke="#174D43" stroke-width="1" />
    <rect x="267" y="141" width="130" height="8" rx="2" fill="#20D9D2" />

    <!-- Center Versus Radar -->
    <circle cx="242" cy="158" r="18" fill="#082A24" stroke="#39F59A" stroke-width="1.5" />
    <text x="242" y="162" text-anchor="middle" class="font-mono" font-size="11" font-weight="900" fill="#39F59A">VS</text>

    <!-- Telemetry status inside diagram -->
    <text x="40" y="174" class="font-mono" font-size="9" fill="#9BAEAA">Canvas Tick: 60 FPS</text>
    <text x="40" y="188" class="font-mono" font-size="9" fill="#20D9D2">State Sync: Deterministic PeerJS</text>
    <text x="266" y="174" class="font-mono" font-size="9" fill="#9BAEAA">Audio: Web Audio API Synth</text>
    <text x="266" y="188" class="font-mono" font-size="9" fill="#39F59A">Zero Server Lag: Browser P2P</text>

    <!-- Tech Badges -->
    <g transform="translate(24, 218)">
      <rect x="0" y="0" width="80" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="40" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#39F59A">Phaser 4</text>

      <rect x="88" y="0" width="76" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="126" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#20D9D2">React 19</text>

      <rect x="172" y="0" width="90" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="217" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#39F59A">TypeScript</text>

      <rect x="270" y="0" width="74" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="307" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#20D9D2">PeerJS</text>

      <rect x="352" y="0" width="84" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="394" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#39F59A">Web Audio</text>

      <rect x="444" y="0" width="66" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="477" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#20D9D2">P2P Mesh</text>
    </g>

    <!-- Bottom Action Prompt -->
    <text x="24" y="266" class="font-mono" font-size="10.5" font-weight="700" fill="#39F59A">
      [🎮 game-rovenor.vercel.app ↗]  •  [github.com/PackhunterforCynic/game ↗]
    </text>
  </g>
</svg>
