<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 490" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-prof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1517" />
      <stop offset="100%" stop-color="#060E10" />
    </linearGradient>
    <radialGradient id="ring-glow-prof" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#39F59A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#39F59A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="258" height="488" rx="12" fill="url(#card-bg-prof)" stroke="#174D43" stroke-width="1.2" />

  <!-- Avatar Circle Section -->
  <g transform="translate(130, 80)">
    <!-- Ambient Glow -->
    <circle cx="0" cy="0" r="62" fill="url(#ring-glow-prof)" />
    <!-- Glowing Emerald Rings -->
    <circle cx="0" cy="0" r="54" fill="#0A1E1A" stroke="#39F59A" stroke-width="2.5" />
    <circle cx="0" cy="0" r="49" fill="#061210" stroke="#20D9D2" stroke-width="1" stroke-dasharray="6 3" />
    <!-- Stylized User Silhouette if photo not rendered in vector -->
    <circle cx="0" cy="-12" r="18" fill="#39F59A" opacity="0.9" />
    <path d="M -30 32 C -30 10 -15 2 0 2 C 15 2 30 10 30 32 Z" fill="#39F59A" opacity="0.9" />
  </g>

  <!-- Username & Display Name -->
  <text x="130" y="162" text-anchor="middle" class="font-sans" font-size="19" font-weight="800" fill="#F4F7F6" letter-spacing="-0.3">PackhunterforCynic</text>
  <text x="130" y="182" text-anchor="middle" class="font-sans" font-size="13" font-weight="600" fill="#39F59A">Robinson J.</text>

  <!-- Headline -->
  <text x="130" y="206" text-anchor="middle" class="font-sans" font-size="10.5" fill="#9BAEAA">Full-Stack Engineer | Real-Time</text>
  <text x="130" y="220" text-anchor="middle" class="font-sans" font-size="10.5" fill="#9BAEAA">Software • WebRTC • AI Vision</text>

  <!-- Info Rows -->
  <g transform="translate(24, 246)">
    <!-- Location -->
    <g transform="translate(0, 0)">
      <path d="M 6 1 C 3.2 1 1 3.2 1 6 C 1 9.5 6 14 6 14 C 6 14 11 9.5 11 6 C 11 3.2 8.8 1 6 1 Z M 6 7.5 C 5.2 7.5 4.5 6.8 4.5 6 C 4.5 5.2 5.2 4.5 6 4.5 C 6.8 4.5 7.5 5.2 7.5 6 C 7.5 6.8 6.8 7.5 6 7.5 Z" fill="#39F59A" />
      <text x="18" y="10" class="font-sans" font-size="11" fill="#C3D2CF">Bengaluru, India</text>
    </g>

    <!-- Email -->
    <g transform="translate(0, 24)">
      <rect x="0" y="1" width="12" height="9" rx="1.5" stroke="#20D9D2" stroke-width="1.2" fill="none" />
      <path d="M 1 2 L 6 6 L 11 2" stroke="#20D9D2" stroke-width="1.2" fill="none" stroke-linecap="round" />
      <text x="18" y="9.5" class="font-sans" font-size="10" fill="#39F59A">robinson30122000@gmail.com</text>
    </g>

    <!-- Portfolio -->
    <g transform="translate(0, 48)">
      <circle cx="6" cy="6" r="5" stroke="#39F59A" stroke-width="1.2" fill="none" />
      <line x1="1" y1="6" x2="11" y2="6" stroke="#39F59A" stroke-width="0.8" />
      <ellipse cx="6" cy="6" rx="2.5" ry="5" stroke="#39F59A" stroke-width="0.8" fill="none" />
      <text x="18" y="9.5" class="font-sans" font-size="10.5" fill="#20D9D2">robinsonj.vercel.app</text>
    </g>

    <!-- LinkedIn -->
    <g transform="translate(0, 72)">
      <rect x="1" y="1" width="10" height="10" rx="2" fill="#20D9D2" />
      <text x="3.5" y="9" font-family="sans-serif" font-size="8" font-weight="bold" fill="#0B1517">in</text>
      <text x="18" y="9.5" class="font-sans" font-size="10.5" fill="#C3D2CF">linkedin.com/in/robinson-mj</text>
    </g>
  </g>

  <!-- Follow Button Inside Card -->
  <g transform="translate(24, 356)">
    <rect x="0" y="0" width="212" height="34" rx="7" fill="#0E211E" stroke="#39F59A" stroke-width="1.2" />
    <path d="M 82 8 C 77.5 8 74 11.5 74 16 C 74 19.5 76.3 22.5 79.4 23.5 L 79.4 21.8 C 77.2 22.3 76.7 20.8 76.7 20.8 C 76.4 19.9 75.8 19.6 75.8 19.6 C 75.1 19.1 75.9 19.1 75.9 19.1 C 76.7 19.2 77.1 19.9 77.1 19.9 C 77.8 21.1 78.9 20.8 79.4 20.6 C 79.5 20.1 79.7 19.7 79.9 19.5 C 78.1 19.3 76.2 18.6 76.2 15.5 C 76.2 14.6 76.5 13.9 77.1 13.3 C 77 13.1 76.7 12.3 77.2 11.2 C 77.2 11.2 77.9 11 79.4 12 C 80.1 11.8 80.8 11.7 81.5 11.7 C 82.2 11.7 82.9 11.8 83.6 12 C 85.1 11 85.8 11.2 85.8 11.2 C 86.3 12.3 86 13.1 85.9 13.3 C 86.5 13.9 86.8 14.6 86.8 15.5 C 86.8 18.6 84.9 19.3 83.1 19.5 C 83.4 19.8 83.6 20.3 83.6 21 L 83.6 23.5 C 86.7 22.5 89 19.5 89 16 C 89 11.5 85.5 8 81 8 Z" fill="#F4F7F6" />
    <text x="100" y="22" class="font-sans" font-size="12.5" font-weight="700" fill="#F4F7F6">Follow</text>
  </g>

  <!-- Quote Box Inside Card -->
  <g transform="translate(24, 404)">
    <rect x="0" y="0" width="212" height="60" rx="7" fill="#071214" stroke="#174D43" stroke-width="0.9" />
    <text x="10" y="24" font-family="Georgia, serif" font-size="24" fill="#39F59A" opacity="0.8">“</text>
    <text x="106" y="27" text-anchor="middle" class="font-mono" font-style="italic" font-size="9" fill="#9BAEAA">Code · Analyze · Build · Automate</text>
    <text x="106" y="42" text-anchor="middle" class="font-mono" font-style="italic" font-size="9.5" fill="#39F59A">Solve · Repeat</text>
    <text x="194" y="52" font-family="Georgia, serif" font-size="24" fill="#39F59A" opacity="0.8">”</text>
  </g>
</svg>

