<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="100" cy="100" r="80" />
    </clipPath>
    <radialGradient id="ring-glow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#39F59A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#39F59A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#ring-glow)" />

  <!-- Outer Neon Emerald Border -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#39F59A" stroke-width="3.5" />

  <!-- Secondary Cyan Ring Accent -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#20D9D2" stroke-width="1.2" stroke-dasharray="8 4" opacity="0.8" />

  <!-- Avatar Photo -->
  <image href="data:image/jpeg;base64," x="20" y="20" width="160" height="160" clip-path="url(#avatar-clip)" preserveAspectRatio="xMidYMid slice" />
</svg>