<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 200" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-havilah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0E131A" />
    </linearGradient>
    <linearGradient id="accent-havilah" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>
  <style>
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect x="1" y="1" width="428" height="198" rx="10" fill="url(#card-bg-havilah)" stroke="#30363D" stroke-width="1.2" />

  <!-- Top Accent Bar -->
  <path d="M 1 10 Q 1 1 10 1 L 420 1 Q 429 1 429 10 L 429 4 L 1 4 Z" fill="url(#accent-havilah)" />

  <!-- Category & Status -->
  <g transform="translate(18, 22)">
    <rect x="0" y="0" width="168" height="18" rx="4" fill="#1F2937" />
    <text x="8" y="12.5" class="font-mono" font-size="9" font-weight="700" fill="#34D399" letter-spacing="0.5">MULTIMEDIA &amp; CINEMA</text>
    
    <g transform="translate(325, 0)">
      <circle cx="5" cy="9" r="3" fill="#34D399" />
      <text x="12" y="12.5" class="font-mono" font-size="9" fill="#8B949E">VERCEL</text>
    </g>
  </g>

  <!-- Title -->
  <text x="18" y="65" class="font-sans" font-size="19" font-weight="700" fill="#F0F6FC">Havilah Studio</text>
  
  <!-- Description -->
  <text x="18" y="88" class="font-sans" font-size="12" fill="#8B949E">
    Cinematic portfolio and film showcase platform
  </text>
  <text x="18" y="105" class="font-sans" font-size="12" fill="#8B949E">
    engineered with Bun, Vite, and GSAP micro-interactions.
  </text>

  <!-- Architecture Highlights -->
  <g transform="translate(18, 126)">
    <text x="0" y="0" class="font-mono" font-size="10.5" fill="#22D3EE">⚡ Bun Runtime • GSAP Motion • Storytelling UI</text>
  </g>

  <!-- Tags -->
  <g transform="translate(18, 148)">
    <rect x="0" y="0" width="76" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="38" y="14.5" text-anchor="middle" class="font-mono" font-size="10" fill="#C9D1D9">TypeScript</text>

    <rect x="82" y="0" width="56" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="110" y="14.5" text-anchor="middle" class="font-mono" font-size="10" fill="#C9D1D9">Bun</text>

    <rect x="144" y="0" width="60" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="174" y="14.5" text-anchor="middle" class="font-mono" font-size="10" fill="#C9D1D9">React</text>

    <rect x="210" y="0" width="56" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="238" y="14.5" text-anchor="middle" class="font-mono" font-size="10" fill="#C9D1D9">GSAP</text>

    <rect x="272" y="0" width="60" height="22" rx="4" fill="#21262D" stroke="#30363D" stroke-width="0.8" />
    <text x="302" y="14.5" text-anchor="middle" class="font-mono" font-size="10" fill="#C9D1D9">Vercel</text>
  </g>

  <!-- External Link Indicator -->
  <g transform="translate(385, 52)" opacity="0.6">
    <path d="M 0 10 L 10 0 M 3 0 L 10 0 L 10 7" stroke="#34D399" stroke-width="1.8" fill="none" stroke-linecap="round" />
  </g>
</svg>

