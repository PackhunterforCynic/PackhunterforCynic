<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 105" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1517" />
      <stop offset="100%" stop-color="#081012" />
    </linearGradient>
    <linearGradient id="thumb-grad-plant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A241A" />
      <stop offset="100%" stop-color="#03110C" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .title { font-size: 13px; font-weight: 700; fill: #39F59A; }
    .desc { font-size: 10px; fill: #9BAEAA; line-height: 1.35; }
    .tag-text { font-size: 8.5px; font-weight: 600; fill: #39F59A; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="268" height="103" rx="8" fill="url(#card-bg)" stroke="#174D43" stroke-width="1.2" />

  <!-- Left: Thumbnail Box -->
  <g transform="translate(10, 14)">
    <rect x="0" y="0" width="95" height="76" rx="6" fill="url(#thumb-grad-plant)" stroke="#174D43" stroke-width="0.8" />
    <!-- Botanical Leaf -->
    <path d="M 48 20 C 65 24 72 45 68 58 C 55 60 30 54 26 42 C 24 32 38 20 48 20 Z" fill="#133E2E" stroke="#39F59A" stroke-width="1.2" />
    <path d="M 34 50 Q 48 38 58 26 M 44 42 Q 52 40 56 44 M 40 46 Q 38 42 36 38" stroke="#39F59A" stroke-width="0.8" fill="none" opacity="0.8" />
    <!-- AI Bounding Reticle -->
    <rect x="20" y="16" width="56" height="46" rx="2" stroke="#20D9D2" stroke-width="0.9" fill="none" stroke-dasharray="3 3" />
    <circle cx="20" cy="16" r="2" fill="#20D9D2" />
    <circle cx="76" cy="62" r="2" fill="#20D9D2" />
  </g>

  <!-- Right: Content -->
  <g transform="translate(114, 18)">
    <text x="0" y="11" class="font-sans title">PlantSense AI</text>
    <path d="M 124 3 L 132 3 M 132 3 L 132 11 M 132 3 L 126 9" stroke="#39F59A" stroke-width="1.2" fill="none" stroke-linecap="round" />

    <text x="0" y="27" class="font-sans desc">Gemini Vision AI diagnosis with</text>
    <text x="0" y="40" class="font-sans desc">ChromaDB vector RAG pipeline.</text>

    <!-- Tags -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="42" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="21" y="10.5" text-anchor="middle" class="font-mono tag-text">Python</text>

      <rect x="46" y="0" width="46" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="69" y="10.5" text-anchor="middle" class="font-mono tag-text">FastAPI</text>

      <rect x="96" y="0" width="50" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="121" y="10.5" text-anchor="middle" class="font-mono tag-text">ChromaDB</text>
    </g>
  </g>
</svg>

