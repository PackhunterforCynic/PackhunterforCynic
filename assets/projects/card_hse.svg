<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 105" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1517" />
      <stop offset="100%" stop-color="#081012" />
    </linearGradient>
    <linearGradient id="thumb-grad-hse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2024" />
      <stop offset="100%" stop-color="#020D10" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .title { font-size: 13px; font-weight: 700; fill: #39F59A; }
    .desc { font-size: 10px; fill: #9BAEAA; line-height: 1.35; }
    .tag-text { font-size: 8.5px; font-weight: 600; fill: #39F59A; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="268" height="103" rx="8" fill="url(#card-bg)" stroke="#174D43" stroke-width="1.2" />

  <!-- Left: Thumbnail Box -->
  <g transform="translate(10, 14)">
    <rect x="0" y="0" width="95" height="76" rx="6" fill="url(#thumb-grad-hse)" stroke="#174D43" stroke-width="0.8" />
    <!-- Lighthouse 99 Performance Arc & Metric -->
    <path d="M 28 50 A 24 24 0 1 1 68 50" stroke="#174D43" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <path d="M 28 50 A 24 24 0 1 1 66 40" stroke="#39F59A" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <text x="48" y="44" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#39F59A">99</text>
    <text x="48" y="58" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#20D9D2">SPEED</text>
  </g>

  <!-- Right: Content -->
  <g transform="translate(114, 18)">
    <text x="0" y="11" class="font-sans title">HSE Media Suite</text>
    <path d="M 124 3 L 132 3 M 132 3 L 132 11 M 132 3 L 126 9" stroke="#39F59A" stroke-width="1.2" fill="none" stroke-linecap="round" />

    <text x="0" y="27" class="font-sans desc">Next.js App Router multi-media</text>
    <text x="0" y="40" class="font-sans desc">engine with automated audits.</text>

    <!-- Tags -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="46" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="23" y="10.5" text-anchor="middle" class="font-mono tag-text">Next.js</text>

      <rect x="50" y="0" width="44" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="72" y="10.5" text-anchor="middle" class="font-mono tag-text">Tailwind</text>

      <rect x="98" y="0" width="38" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="117" y="10.5" text-anchor="middle" class="font-mono tag-text">Vercel</text>
    </g>
  </g>
</svg>

