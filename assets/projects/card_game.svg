<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 105" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1517" />
      <stop offset="100%" stop-color="#081012" />
    </linearGradient>
    <linearGradient id="thumb-grad-game" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E0F" />
      <stop offset="100%" stop-color="#050E04" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .title { font-size: 13px; font-weight: 700; fill: #39F59A; }
    .desc { font-size: 10px; fill: #9BAEAA; line-height: 1.35; }
    .tag-text { font-size: 8.5px; font-weight: 600; fill: #39F59A; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="268" height="103" rx="8" fill="url(#card-bg)" stroke="#174D43" stroke-width="1.2" />

  <!-- Left: Thumbnail Box -->
  <g transform="translate(10, 14)">
    <rect x="0" y="0" width="95" height="76" rx="6" fill="url(#thumb-grad-game)" stroke="#174D43" stroke-width="0.8" />
    <!-- Omnitrix Dial / Energy Burst -->
    <circle cx="48" cy="38" r="22" stroke="#39F59A" stroke-width="1.8" fill="none" opacity="0.8" />
    <circle cx="48" cy="38" r="14" fill="#0D2D24" stroke="#39F59A" stroke-width="1" />
    <!-- Hourglass shape -->
    <path d="M 39 29 L 57 29 L 48 38 L 57 47 L 39 47 L 48 38 Z" fill="#39F59A" />
    <!-- Arena grid line -->
    <line x1="10" y1="62" x2="85" y2="62" stroke="#20D9D2" stroke-width="0.8" opacity="0.5" />
  </g>

  <!-- Right: Content -->
  <g transform="translate(114, 18)">
    <text x="0" y="11" class="font-sans title">Ben 10 Arena</text>
    <path d="M 124 3 L 132 3 M 132 3 L 132 11 M 132 3 L 126 9" stroke="#39F59A" stroke-width="1.2" fill="none" stroke-linecap="round" />

    <text x="0" y="27" class="font-sans desc">2D fighting arena in Phaser 4</text>
    <text x="0" y="40" class="font-sans desc">with PeerJS P2P multiplayer.</text>

    <!-- Tags -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="46" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="23" y="10.5" text-anchor="middle" class="font-mono tag-text">Phaser 4</text>

      <rect x="50" y="0" width="46" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="73" y="10.5" text-anchor="middle" class="font-mono tag-text">React 19</text>

      <rect x="100" y="0" width="45" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="122.5" y="10.5" text-anchor="middle" class="font-mono tag-text">PeerJS</text>
    </g>
  </g>
</svg>

