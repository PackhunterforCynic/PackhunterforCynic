<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 105" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1517" />
      <stop offset="100%" stop-color="#081012" />
    </linearGradient>
    <linearGradient id="thumb-grad-musica" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062226" />
      <stop offset="100%" stop-color="#021013" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .title { font-size: 13px; font-weight: 700; fill: #39F59A; }
    .desc { font-size: 10px; fill: #9BAEAA; line-height: 1.35; }
    .tag-text { font-size: 8.5px; font-weight: 600; fill: #39F59A; }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="268" height="103" rx="8" fill="url(#card-bg)" stroke="#174D43" stroke-width="1.2" />

  <!-- Left: Thumbnail Box -->
  <g transform="translate(10, 14)">
    <rect x="0" y="0" width="95" height="76" rx="6" fill="url(#thumb-grad-musica)" stroke="#174D43" stroke-width="0.8" />
    <!-- Audio Waveform Graphics -->
    <path d="M 12 40 L 22 28 L 32 46 L 42 22 L 52 50 L 62 30 L 72 44 L 82 38" stroke="#20D9D2" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 12 40 L 22 34 L 32 43 L 42 30 L 52 46 L 62 36 L 72 41 L 82 38" stroke="#39F59A" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round" />
    <!-- Broadcast Beacon -->
    <circle cx="48" cy="18" r="3" fill="#39F59A" />
    <circle cx="48" cy="18" r="7" stroke="#39F59A" stroke-width="0.8" fill="none" opacity="0.5" />
    <circle cx="48" cy="18" r="11" stroke="#20D9D2" stroke-width="0.6" fill="none" opacity="0.3" />
  </g>

  <!-- Right: Content -->
  <g transform="translate(114, 18)">
    <!-- Title + Arrow -->
    <text x="0" y="11" class="font-sans title">Musica Platform</text>
    <path d="M 124 3 L 132 3 M 132 3 L 132 11 M 132 3 L 126 9" stroke="#39F59A" stroke-width="1.2" fill="none" stroke-linecap="round" />

    <!-- Description -->
    <text x="0" y="27" class="font-sans desc">Zero-DB WebSockets &amp;</text>
    <text x="0" y="40" class="font-sans desc">WebRTC audio streaming.</text>

    <!-- Tags -->
    <g transform="translate(0, 52)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="46" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="23" y="10.5" text-anchor="middle" class="font-mono tag-text">WebRTC</text>

      <!-- Tag 2 -->
      <rect x="50" y="0" width="46" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="73" y="10.5" text-anchor="middle" class="font-mono tag-text">Node.js</text>

      <!-- Tag 3 -->
      <rect x="100" y="0" width="45" height="15" rx="3" fill="#0D2420" stroke="#174D43" stroke-width="0.7" />
      <text x="122.5" y="10.5" text-anchor="middle" class="font-mono tag-text">Socket.IO</text>
    </g>
  </g>
</svg>

