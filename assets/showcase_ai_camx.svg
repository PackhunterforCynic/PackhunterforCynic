      <text x="116" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#20D9D2">FastAPI</text>

      <rect x="162" y="0" width="86" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="205" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#39F59A">Gemini AI</text>

      <rect x="256" y="0" width="94" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="303" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#20D9D2">ChromaDB</text>

      <rect x="358" y="0" width="70" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="393" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#39F59A">RAG Net</text>

      <rect x="436" y="0" width="76" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="474" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#20D9D2">Vision AI</text>
