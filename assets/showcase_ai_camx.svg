      <rect x="186" y="0" width="96" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="234" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#39F59A">Optics Physics</text>

      <rect x="290" y="0" width="86" height="24" rx="5" fill="#07221C" stroke="#174D43" stroke-width="1" />
      <text x="333" y="16" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#20D9D2">Voice API</text>

