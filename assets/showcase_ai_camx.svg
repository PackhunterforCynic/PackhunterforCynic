      <polygon points="0,-24 16,-12 10,10 -12,18 -22,-2" fill="#0E332B" stroke="#39F59A" stroke-width="1.2" />
      <circle cx="0" cy="0" r="10" fill="#040A0C" stroke="#20D9D2" stroke-width="1.5" />
      <text x="0" y="44" text-anchor="middle" class="font-mono" font-size="8.5" fill="#39F59A">f/1.8 APERTURE</text>
