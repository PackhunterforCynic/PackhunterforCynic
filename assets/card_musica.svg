    @keyframes pulseRing {
      0% { r: 6; opacity: 1; }
      100% { r: 22; opacity: 0; }
    }
    .ping { animation: pulseRing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
  </style>
